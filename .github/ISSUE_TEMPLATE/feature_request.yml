name: Feature Request
description: Suggest an idea or enhancement for Compass.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Compass better? Tell us about it!

  - type: textarea
    id: feature_summary
    attributes:
      label: Feature Summary
      description: What feature or enhancement would you like to see?
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Target Domain / Area
      description: Which area does this feature relate to?
      options:
        - Hackathon
        - Coursework
        - Code & Development
        - General Life / Task Management
        - Agent & Autonomous Skills
        - Integrations (Google Calendar, Canvas, etc.)
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Problem & Motivation
      description: What problem does this solve for you?
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / Workflow
      description: How should this work from a user's perspective?
    validations:
      required: false
