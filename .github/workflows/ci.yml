name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend: lint + tests
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend — Lint, Test & Integration Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: compass
          POSTGRES_PASSWORD: compass
          POSTGRES_DB: compass_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            requirements-test.txt

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install test dependencies
        run: |
          pip install -r requirements-test.txt

      - name: Install CLI (editable)
        run: |
          pip install -e ./cli

      - name: Install Ruff (linter)
        run: pip install ruff

      - name: Syntax check — compile key modules
        run: |
          python -m py_compile \
            backend/main.py \
            backend/router.py \
            backend/orchestrator.py \
            backend/agent.py \
            backend/jobs/consolidate.py \
            cli/assistant_cli.py

      - name: Ruff — lint backend, cli, tests
        run: ruff check backend cli tests

      - name: Initialize test database schema
        env:
          PGPASSWORD: compass
        run: |
          psql -h localhost -U compass -d compass_test -f backend/memory/schema.sql

      - name: Collect tests (verify count before running)
        env:
          DATABASE_URL: postgresql://compass:compass@localhost:5432/compass_test
          TEST_DATABASE_URL: postgresql://compass:compass@localhost:5432/compass_test
          AUTH_TOKEN: ci-test-token
          NEBIUS_API_KEY: mock-key-not-used-in-tests
          TAVILY_API_KEY: mock-key-not-used-in-tests
          PROD_DB_ENDPOINT: ""
        run: |
          python -m pytest tests --collect-only -q 2>&1 | tail -5

      - name: Run test suite
        env:
          DATABASE_URL: postgresql://compass:compass@localhost:5432/compass_test
          TEST_DATABASE_URL: postgresql://compass:compass@localhost:5432/compass_test
          AUTH_TOKEN: ci-test-token
          NEBIUS_API_KEY: mock-key-not-used-in-tests
          TAVILY_API_KEY: mock-key-not-used-in-tests
          PROD_DB_ENDPOINT: ""
        run: |
          python -m pytest tests -v -ra --tb=short --no-header \
            -p no:warnings \
            2>&1

  # ─────────────────────────────────────────────────────────────
  # Frontend: install + build
  # ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (deterministic)
        run: npm ci

      - name: Build production bundle
        env:
          VITE_API_BASE_URL: http://localhost:8000
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # Docker: compose validation + image builds + backend smoke test
  # No images are published or deployed.
  # ─────────────────────────────────────────────────────────────
  docker:
    name: Docker — Build & Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 1. Validate docker-compose.yml structure ──────────────
      - name: Validate Docker Compose config
        run: docker compose config --quiet

      # ── 2. Build backend image and load into local daemon ─────
      #    load: true is required for the smoke test that follows.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: compass-backend:ci

      # ── 3. Backend smoke test ─────────────────────────────────
      #    /health returns HTTP 200 {"status":"ok"} even with no DB
      #    (pool init failure is caught and logged, not raised).
      #    No production credentials are needed.
      - name: Smoke test — backend /health
        run: |
          docker run -d \
            --name compass-smoke \
            -p 18000:8000 \
            -e DATABASE_URL="postgresql://nobody:nobody@localhost:5432/nobody" \
            -e AUTH_TOKEN="smoke-test-token" \
            -e NEBIUS_API_KEY="mock" \
            -e LOG_LEVEL="WARNING" \
            compass-backend:ci

          echo "Waiting for server to start..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:18000/health > /dev/null 2>&1; then
              echo "Server is up"
              break
            fi
            sleep 1
          done

          echo "--- /health response ---"
          curl -sf http://localhost:18000/health | python3 -m json.tool

          echo "--- Verifying status field ---"
          STATUS=$(curl -sf http://localhost:18000/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'])")
          if [ "$STATUS" != "ok" ]; then
            echo "FAIL: expected status=ok, got: $STATUS"
            docker logs compass-smoke
            exit 1
          fi
          echo "PASS: status=ok"

          docker stop compass-smoke
          docker rm compass-smoke

      # ── 4. Build frontend image ───────────────────────────────
      #    Multi-stage: node:20-alpine build → nginx:alpine serve
      #    No runtime secrets required for the build.
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: compass-frontend:ci
