name: Docker Build Verification

# This workflow runs on Docker-specific path changes to give fast feedback
# without waiting for the full backend test suite to finish.
# The main CI workflow (ci.yml) also includes Docker validation on every PR.

on:
  push:
    branches: [main]
    paths:
      - 'backend/Dockerfile'
      - 'backend/requirements.txt'
      - 'frontend/Dockerfile'
      - 'frontend/package*.json'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'frontend/.dockerignore'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/Dockerfile'
      - 'backend/requirements.txt'
      - 'frontend/Dockerfile'
      - 'frontend/package*.json'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'frontend/.dockerignore'
      - '.github/workflows/docker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-compose:
    name: Validate Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  build-backend:
    name: Build Backend Image + Smoke Test
    runs-on: ubuntu-latest
    needs: validate-compose
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: compass-backend:ci

      - name: Smoke test — backend /health
        run: |
          docker run -d \
            --name compass-smoke \
            -p 18000:8000 \
            -e DATABASE_URL="postgresql://nobody:nobody@localhost:5432/nobody" \
            -e AUTH_TOKEN="smoke-test-token" \
            -e NEBIUS_API_KEY="mock" \
            -e LOG_LEVEL="WARNING" \
            compass-backend:ci

          echo "Waiting for server to start..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:18000/health > /dev/null 2>&1; then
              echo "Server is up after ${i}s"
              break
            fi
            sleep 1
          done

          echo "--- /health response ---"
          curl -sf http://localhost:18000/health | python3 -m json.tool

          echo "--- Verifying status=ok ---"
          STATUS=$(curl -sf http://localhost:18000/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'])")
          if [ "$STATUS" != "ok" ]; then
            echo "FAIL: expected status=ok, got: $STATUS"
            docker logs compass-smoke
            exit 1
          fi
          echo "PASS: status=ok"

          docker stop compass-smoke
          docker rm compass-smoke

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: validate-compose
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: compass-frontend:ci
