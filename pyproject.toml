[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E402",  # Module level import not at top of file (needed for sys.path configuration)
    "E501",  # Line too long
    "F401",  # Imported but unused (common in API route exports & test fixtures)
    "F841",  # Local variable assigned but never used
    "W291",  # Trailing whitespace
    "W293",  # Blank line contains whitespace
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401", "F841"]
"scripts/*" = ["E402"]
